[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-mirror-recursive"
version = "0.9.0"
description = "Recursive, evidence-gated self-improvement of an LLM agent's strategy and self-model"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
recursive-mirror = "recursive_mirror.cli:main"

[tool.setuptools.packages.find]
include = ["recursive_mirror*"]
